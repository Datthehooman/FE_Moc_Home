---
version: 2
deployment:
  tasks:
    - task: Install Dependencies
      commands:
        - echo "Installing dependencies..."
        - npm install

    - task: Build Nuxt Project
      commands:
        - echo "Building Nuxt 4 project..."
        - npx nuxi build
        - npx nuxi generate

    - task: Deploy to public_html
      commands:
        - echo "Deploying to public_html..."
        # Remove old files but keep .htaccess if exists
        - find $HOME/public_html ! -name ".htaccess" -type f -exec rm -f {} +
        - rsync -av --delete .output/public/ $HOME/public_html/
